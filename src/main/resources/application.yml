server:
  port: 8081

spring:
  application:
    name: Identifier
  datasource:
    url: jdbc:postgresql://localhost:5432/EmployeeDB
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      all: true